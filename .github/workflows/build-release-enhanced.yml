name: Build & Release (Enhanced)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.4-beta.1)'
        required: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    needs: security-scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Generate SBOM with CycloneDX
        run: dotnet tool run cyclonedx -o sbom.json

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive
        continue-on-error: true

      - name: Build Release
        run: dotnet publish -c Release -o ./publish --self-contained --runtime win-x64

      - name: Create Release with Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: GamingCommander ${{ github.event.inputs.version }}
          draft: false
          prerelease: true
          files: |
            ./publish/**/*
            ./sbom.json
